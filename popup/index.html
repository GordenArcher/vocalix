<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vocalix</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <span class="logo">🔊 Vocalix</span>
                <div class="tabs">
                    <button class="tab active" data-tab="settings">
                        Settings
                    </button>
                    <button class="tab" data-tab="history">History</button>
                </div>
            </header>

            <div id="tab-settings">
                <section class="field">
                    <label for="voice-select">Voice</label>
                    <select id="voice-select">
                        <option value="">Loading voices...</option>
                    </select>
                </section>

                <section class="field">
                    <label for="rate"
                        >Speed <span id="rate-value">1.0</span>x</label
                    >
                    <input
                        type="range"
                        id="rate"
                        min="0.5"
                        max="2"
                        step="0.1"
                        value="1"
                    />
                </section>

                <section class="field">
                    <label for="pitch"
                        >Pitch <span id="pitch-value">1.0</span></label
                    >
                    <input
                        type="range"
                        id="pitch"
                        min="0"
                        max="2"
                        step="0.1"
                        value="1"
                    />
                </section>

                <section class="field">
                    <label for="volume"
                        >Volume <span id="volume-value">1.0</span></label
                    >
                    <input
                        type="range"
                        id="volume"
                        min="0"
                        max="1"
                        step="0.1"
                        value="1"
                    />
                </section>

                <section class="field row">
                    <div>
                        <label for="min-length">Minimum selection length</label>
                        <p class="hint">
                            Characters required before Read button appears
                        </p>
                    </div>
                    <input
                        type="number"
                        id="min-length"
                        min="1"
                        max="500"
                        value="2"
                    />
                </section>

                <section class="field row">
                    <div>
                        <label for="auto-read">Auto-read on highlight</label>
                        <p class="hint">
                            Reads immediately when you select text
                        </p>
                    </div>
                    <input type="checkbox" id="auto-read" />
                </section>

                <section class="field row">
                    <div>
                        <label for="highlight-words">Highlight words</label>
                        <p class="hint">Highlights each word as it is spoken</p>
                    </div>
                    <input type="checkbox" id="highlight-words" checked />
                </section>

                <button id="save-btn">Save settings</button>
                <button id="reread-btn">🔁 Re-read last</button>
            </div>

            <div id="tab-history" class="hidden">
                <div class="history-header">
                    <span class="history-count" id="history-count"
                        >0 items</span
                    >
                    <button id="clear-btn">Clear all</button>
                </div>
                <ul id="history-list">
                    <li class="empty">No history yet</li>
                </ul>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
